<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaye Turgay Taşdan | Klinik Psikolog & Psikoterapist</title>
  <meta name="description" content="Gaye Turgay Taşdan — Klinik Psikolog ve Psikoterapist. İletişim bilgileri.">
  <style>
    :root {
      --bg: #f7f5f1;
      --paper: #fffdfa;
      --text: #2f3431;
      --muted: #737873;
      --line: #ddd9d0;
      --accent: #6f7d72;
      --accent-dark: #56645b;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: grid;
      place-items: center;
    }
    main {
      width: min(680px, calc(100% - 40px));
      padding: 72px 28px;
      text-align: center;
    }
    .mark {
      width: 42px;
      height: 1px;
      background: var(--accent);
      margin: 0 auto 30px;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 52px);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.12;
    }
    .title {
      margin: 18px 0 0;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      letter-spacing: .06em;
      line-height: 1.8;
    }
    .location {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .contact {
      margin: 52px auto 0;
      padding-top: 28px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px 30px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }
    a {
      color: var(--text);
      text-decoration: none;
      transition: color .2s ease;
    }
    a:hover { color: var(--accent-dark); }
    .location {
      margin-top: 14px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
    }

    .linkedin {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 30px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--accent-dark);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      letter-spacing: .02em;
    }
    .linkedin:hover {
      border-color: var(--accent);
      background: rgba(111,125,114,.06);
    }
    .note {
      margin-top: 70px;
      color: #a0a39f;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: .03em;
    }
    @media (max-width: 520px) {
      main { padding: 52px 18px; }
      .contact { flex-direction: column; gap: 12px; }
      .note { margin-top: 55px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Gaye Turgay Taşdan</h1>
    <p class="title">Klinik Psikolog<br>Psikoterapist</p>

    <div class="contact">
      <a href="mailto:gayeturgay@gmail.com">gayeturgay@gmail.com</a>
      <a href="tel:+905416338835">0541 633 88 35</a>
    </div>

    <div class="location">İstanbul</div>

    <a class="linkedin" href="https://www.linkedin.com/in/gayeturgay/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profili">
      LinkedIn
    </a>

    <div class="note">© Gaye Turgay Taşdan</div>
  </main>
</body>
</html>
